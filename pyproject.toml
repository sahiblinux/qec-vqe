[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-vqe"
version = "0.1.0"
description = "Hardware-aware quantum error correction and noise mitigation for NISQ-era VQE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.15",
    "qiskit-nature>=0.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["qec_vqe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]